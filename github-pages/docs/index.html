<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>周亚伟作品网 · 作品集</title>
    <meta name="description" content="周亚伟作品网：平面摄影、动态影像与品牌合作的个人作品集。" />
    <meta name="theme-color" content="#050505" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:site_name" content="周亚伟作品网" />
    <meta property="og:title" content="周亚伟作品网 · 作品集" />
    <meta property="og:description" content="平面摄影、动态影像与品牌合作的个人作品集。" />
    <meta property="og:image" content="https://zhoudong-cn.github.io/zhouyawei/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preload" as="image" href="assets/hero-poster.jpg" fetchpriority="high" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      document.documentElement.classList.add("js-anim");
    </script>
  </head>

  <body>
    <div class="gate">
      <div class="plate" aria-hidden="true">
        <video
          class="plate-video"
          autoplay
          muted
          loop
          playsinline
          preload="metadata"
          poster="assets/hero-poster.jpg"
        >
          <source src="assets/hero-loop.mp4" type="video/mp4" />
        </video>
      </div>

      <main class="gate-inner">
        <h1 class="gate-title">周亚伟作品网</h1>
        <p class="gate-sub">平面摄影 · 动态影像 · 品牌合作</p>

        <nav class="entries" aria-label="作品入口">
          <a class="entry" href="intro.html">
            <span class="entry-ico">
              <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
                <circle cx="16" cy="11.4" r="5.4" stroke="currentColor" stroke-width="1.5" />
                <path
                  d="M5.6 27.4c1.6-5.2 5.5-8 10.4-8s8.8 2.8 10.4 8"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
              </svg>
            </span>
            <span class="entry-name">个人简介</span>
          </a>

          <a class="entry" href="photos.html">
            <span class="entry-ico">
              <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
                <rect
                  x="3.6"
                  y="6.6"
                  width="24.8"
                  height="18.8"
                  rx="2.6"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
                <circle cx="11.4" cy="13.2" r="2.1" stroke="currentColor" stroke-width="1.5" />
                <path
                  d="M4.4 22.6l6.1-6.2 4.6 4.4 4.1-3.6 8.4 7"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
            <span class="entry-name">图片作品</span>
          </a>

          <a class="entry" href="videos.html">
            <span class="entry-ico">
              <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
                <rect
                  x="3.6"
                  y="7.4"
                  width="24.8"
                  height="17.2"
                  rx="2.6"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
                <path
                  d="M13.6 12.6l5.6 3.4-5.6 3.4z"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
            <span class="entry-name">视频作品</span>
          </a>
        </nav>
      </main>

      <footer class="gate-foot">
        <span>© <span id="year">2026</span> 周亚伟作品网</span>
        <span class="sep" aria-hidden="true">·</span>
        <span>时尚摄影 · 动态影像</span>
      </footer>
    </div>

    <script>
      (function () {
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var v = document.querySelector(".plate-video");
        if (reduce && v) {
          v.removeAttribute("autoplay");
          v.pause();
        } else if (v && "IntersectionObserver" in window) {
          new IntersectionObserver(function (e) {
            e[0].isIntersecting ? v.play().catch(function () {}) : v.pause();
          }).observe(v);
        }
        var y = document.getElementById("year");
        if (y) y.textContent = new Date().getFullYear();
      })();
    </script>
  </body>
</html>
